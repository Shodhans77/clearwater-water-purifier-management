services:
  - type: web
    name: clearwater-api-shodhan
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    preDeployCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: DEVICE_OFFLINE_SECONDS
        value: "35"
      - key: DEMO_SIMULATOR
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: worker
    name: clearwater-report-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: npm run worker:reports --workspace apps/api
    disk:
      name: clearwater-reports
      mountPath: /opt/render/project/src/reports
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: clearwater-demo-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: npm run worker:demo --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
